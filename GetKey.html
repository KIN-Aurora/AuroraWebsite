<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora - Get Script Key</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0c0c0c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #16161a;
            border: 1px solid #282830;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #3b82f6;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #a1a1aa;
            margin-bottom: 2rem;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .btn {
            width: 100%;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .logo-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            background-color: rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-logo {
            width: 18px;
            height: 18px;
            object-fit: contain;
            border-radius: 50%;
        }

        .btn-linkvertise {
            background-color: #f59e0b;
        }
        .btn-linkvertise:hover {
            background-color: #d97706;
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-lootlabs {
            background-color: #6366f1;
        }
        .btn-lootlabs:hover {
            background-color: #4f46e5;
            border-color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">Aurora Key System</h1>
        <p class="subtitle">Select your preferred platform to obtain a key</p>

        <div class="btn-container">
            <button class="btn btn-linkvertise" onclick="redirectTo('linkvertise')">
                <div class="logo-badge">
                    <img src="https://www.google.com/s2/favicons?domain=linkvertise.com&sz=128" alt="Linkvertise Logo" class="btn-logo">
                </div>
                Get Key Linkvertise
            </button>

            <button class="btn btn-lootlabs" onclick="redirectTo('lootlabs')">
                <div class="logo-badge">
                    <img src="https://www.google.com/s2/favicons?domain=lootlabs.gg&sz=128" alt="Lootlabs Logo" class="btn-logo">
                </div>
                Get Key Lootlabs
            </button>
        </div>
    </div>

    <script>
        const KEY_URLS = {
            linkvertise: "https://linkvertise.com/123456/your-link-here",
            lootlabs: "https://loot-link.com/s?your-link-here"
        };

        function redirectTo(provider) {
            window.location.href = KEY_URLS[provider];
        }
    </script>

</body>
</html>
