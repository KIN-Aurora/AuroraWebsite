<!doctype html>
<html lang="en" class="h-full">
 <head>
  <script src="/_sdk/telemetry_sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Key System</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&amp;family=Rajdhani:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 200, 255, 0.4), 0 0 60px rgba(0, 200, 255, 0.1); }
      50% { box-shadow: 0 0 40px rgba(0, 200, 255, 0.7), 0 0 100px rgba(0, 200, 255, 0.3); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes scan-line {
      0% { top: -100%; }
      100% { top: 100%; }
    }
    @keyframes video-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(0, 200, 255, 0.3), inset 0 0 15px rgba(0, 200, 255, 0.1), 0 0 30px rgba(0, 200, 255, 0.2); }
      50% { box-shadow: 0 0 25px rgba(0, 200, 255, 0.6), inset 0 0 20px rgba(0, 200, 255, 0.2), 0 0 50px rgba(0, 200, 255, 0.4); }
    }
    .glow-btn { animation: pulse-glow 2.5s ease-in-out infinite; }
    .float-anim { animation: float 4s ease-in-out infinite; }
    .video-glow { animation: video-glow 2s ease-in-out infinite; }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.6;
    }
    .scan-overlay::after {
      content: '';
      position: absolute;
      left: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(transparent, rgba(0, 200, 255, 0.03), transparent);
      animation: scan-line 4s linear infinite;
      pointer-events: none;
    }
  </style>
  <style>body { box-sizing: border-box; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full w-full overflow-auto relative bg-gray-950 scan-overlay" style="font-family: 'Rajdhani', sans-serif;">
   <div id="stars" class="absolute inset-0 overflow-hidden pointer-events-none"></div>
   <div class="relative z-10 flex flex-col items-center justify-center min-h-full px-4 py-12">
    <div class="float-anim mb-2">
     <i data-lucide="key-round" style="width:48px;height:48px;color:#00c8ff;" class="mx-auto block"></i>
    </div>
    <h1 id="main-title" class="text-4xl md:text-6xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2 text-center" style="font-family:'Orbitron',sans-serif;">AURORA</h1>
    <p class="text-cyan-300/60 text-sm tracking-[0.3em] uppercase mb-12">Key System</p>
    <button id="key-btn" class="glow-btn relative inline-flex items-center gap-3 px-10 py-4 rounded-lg bg-gradient-to-r from-cyan-600 to-blue-700 text-white font-bold text-lg tracking-wider uppercase border border-cyan-400/30 hover:from-cyan-500 hover:to-blue-600 transition-all duration-300 hover:scale-105 cursor-pointer" style="font-family:'Orbitron',sans-serif;"> 
      <i data-lucide="lock" style="width:20px;height:20px;"></i> 
      <span id="btn-text">GET KEY</span> 
      <i data-lucide="external-link" style="width:16px;height:16px;opacity:0.7;"></i> 
    </button>
    <p class="text-cyan-500/40 text-xs mt-4 tracking-wider">Click to proceed to verification</p>
    
    <div class="mt-16 w-full max-w-2xl">
     <div class="flex items-center gap-2 mb-4 justify-center">
      <i data-lucide="monitor-play" style="width:20px;height:20px;color:#00c8ff;"></i>
      <h2 class="text-cyan-300 text-lg font-bold tracking-wider uppercase" style="font-family:'Orbitron',sans-serif;">Tutorial</h2>
     </div>
     <div id="video-frame" class="video-glow relative rounded-xl overflow-hidden border border-cyan-500/30 bg-gray-900/80 shadow-2xl shadow-cyan-900/20" style="padding-bottom:56.25%;">
      <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
     </div>
     <div class="flex flex-col items-center gap-6 mt-8">
      <div class="flex items-center gap-2">
       <i data-lucide="mail-contact" style="width:20px;height:20px;color:#00c8ff;"></i>
       <h3 class="text-cyan-300 text-lg font-bold tracking-wider uppercase" style="font-family:'Orbitron',sans-serif;">Contact Us</h3>
      </div>
      <div class="flex gap-4 justify-center">
        <button id="discord-btn" class="flex items-center gap-2 px-6 py-3 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-700 text-white font-bold tracking-wider uppercase border border-indigo-400/30 hover:from-indigo-500 hover:to-purple-600 transition-all duration-300 hover:scale-105 cursor-pointer" style="font-family:'Orbitron',sans-serif;">
          <svg style="width:18px;height:18px;fill:currentColor;" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.317 4.369a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.444.864-.607 1.25a18.27 18.27 0 0 0-5.487 0c-.163-.386-.396-.875-.607-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.042-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.294.075.075 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.075.075 0 0 1 .079.009c.12.098.246.198.373.294a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.076.076 0 0 0-.041.107c.359.698.77 1.364 1.225 1.994a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.030.077.077 0 0 0 .032-.054c.5-4.718-.838-8.812-3.549-12.54a.06.06 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-.965-2.157-2.156 0-1.193.964-2.157 2.157-2.157 1.193 0 2.156.964 2.156 2.157 0 1.19-.963 2.156-2.156 2.156zm7.975 0c-1.183 0-2.157-.965-2.157-2.156 0-1.193.964-2.157 2.157-2.157 1.193 0 2.156.964 2.156 2.157 0 1.19-.963 2.156-2.156 2.156z"></path></svg> 
          Discord 
        </button> 
        <button id="youtube-btn" class="flex items-center gap-2 px-6 py-3 rounded-lg bg-gradient-to-r from-red-600 to-orange-700 text-white font-bold tracking-wider uppercase border border-red-400/30 hover:from-red-500 hover:to-orange-600 transition-all duration-300 hover:scale-105 cursor-pointer" style="font-family:'Orbitron',sans-serif;"> 
          <i data-lucide="play" style="width:18px;height:18px;"></i> 
          Youtube 
        </button>
      </div>
     </div>
    </div>
    <p class="text-cyan-900 text-xs mt-12 tracking-wider">© 2026 Aurora</p>
   </div>
      
   <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-gray-950 border border-cyan-500/30 rounded-xl p-8 max-w-md w-full shadow-2xl shadow-cyan-900/50 text-center">
     <div id="loading-spinner" class="flex justify-center mb-4">
      <i data-lucide="loader" style="width:40px;height:40px;color:#00c8ff;animation:spin 1s linear infinite;" class="block"></i>
     </div>
     <h3 id="modal-text" class="text-cyan-300 font-bold tracking-wider text-lg mb-2" style="font-family:'Orbitron',sans-serif;">Generating key...</h3>
     <p id="modal-subtext" class="text-cyan-500/60 text-sm mb-6">Please wait</p>
     <button id="modal-confirm-btn" class="hidden w-full py-3 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold tracking-wider uppercase border border-cyan-400/30 hover:from-cyan-400 hover:to-blue-500 transition-all duration-300 hover:scale-105 cursor-pointer" style="font-family:'Orbitron',sans-serif;">
       Proceed
     </button>
    </div>
   </div>
  </div>

  <script>
    // Generate stars background
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.opacity = Math.random() * 0.7 + 0.1;
      star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
      starsContainer.appendChild(star);
    }

    lucide.createIcons();

    // Modal control DOMs
    const modal = document.getElementById('modal');
    const modalText = document.getElementById('modal-text');
    const modalSubtext = document.getElementById('modal-subtext');
    const loadingSpinner = document.getElementById('loading-spinner');
    const confirmBtn = document.getElementById('modal-confirm-btn');
    let pendingUrl = '';

    // Only Key System uses this animation now
    async function showLinkModal(url) {
      pendingUrl = url;
      modal.classList.remove('hidden');
      modalText.textContent = 'Generating link...';
      modalSubtext.textContent = 'Please wait';
      
      loadingSpinner.innerHTML = `<i data-lucide="loader" style="width:40px;height:40px;color:#00c8ff;animation:spin 1s linear infinite;" class="block"></i>`;
      lucide.createIcons();
      
      loadingSpinner.classList.remove('hidden');
      confirmBtn.classList.add('hidden');

      await new Promise(resolve => setTimeout(resolve, 10000));

      modalText.textContent = 'Link generated successfully!';
      modalSubtext.textContent = 'Ready to redirect';
      
      loadingSpinner.innerHTML = `<i data-lucide="check" style="width:40px;height:40px;color:#00ff00;" class="block"></i>`;
      lucide.createIcons();
      
      confirmBtn.classList.remove('hidden');
    }

    // [GET KEY] Button -> Keeps the simulated loading popup
    const keyBtn = document.getElementById('key-btn');
    keyBtn.addEventListener('click', () => {
      showLinkModal('https://jnkie.com/get-key/aurora');
    });

    // [Discord] Button -> DIRECT REDIRECT (No modal)
    const discordBtn = document.getElementById('discord-btn');
    discordBtn.addEventListener('click', () => {
      window.open('https://discord.gg/mPcFDrjTBz', '_blank');
    });

    // [YouTube] Button -> DIRECT REDIRECT (No modal)
    const youtubeBtn = document.getElementById('youtube-btn');
    youtubeBtn.addEventListener('click', () => {
      window.open('https://www.youtube.com/@Kin_Aurora', '_blank');
    });

    // Modal Confirmation Action
    confirmBtn.addEventListener('click', () => {
      modal.classList.add('hidden');
      window.open(pendingUrl, '_blank');
    });

    // Element SDK Settings
    const defaultConfig = {
      main_title: 'KEY SYSTEM',
      button_text: 'GET KEY',
      background_color: '#030712',
      accent_color: '#00c8ff',
      text_color: '#00c8ff',
      font_family: 'Orbitron',
      font_size: 16
    };

    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        document.getElementById('main-title').textContent = config.main_title || defaultConfig.main_title;
        document.getElementById('btn-text').textContent = config.button_text || defaultConfig.button_text;
        document.getElementById('app').style.backgroundColor = config.background_color || defaultConfig.background_color;
        const accent = config.accent_color || defaultConfig.accent_color;
        document.getElementById('main-title').style.color = accent;
        const font = config.font_family || defaultConfig.font_family;
        document.getElementById('main-title').style.fontFamily = `${font}, Orbitron, sans-serif`;
        const base = config.font_size || defaultConfig.font_size;
        document.getElementById('main-title').style.fontSize = `${base * 2.5}px`;
      },
      mapToCapabilities: (config) => ({
        recolorables: [
          { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
          { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
          { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } }
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
        fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
      }),
      mapToEditPanelValues: (config) => new Map([
        ['main_title', config.main_title || defaultConfig.main_title],
        ['button_text', config.button_text || defaultConfig.button_text]
      ])
    });
  </script>
 </body>
</html>
