  <style>
        body { font-family: 'DM Sans', sans-serif; }
        .aurora-bg {
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a4e 30%, #24243e 50%, #0f2027 70%, #0a1628 100%);
        }
        .aurora-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: drift 8s ease-in-out infinite alternate;
        }
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.1); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pageSlideIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .fade-up { animation: fadeUp 0.8s ease forwards; }
        .fade-up-delay { animation: fadeUp 0.8s ease 0.2s forwards; opacity: 0; }
        .fade-up-delay2 { animation: fadeUp 0.8s ease 0.4s forwards; opacity: 0; }
        .page-entrance { animation: pageSlideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    </style>
